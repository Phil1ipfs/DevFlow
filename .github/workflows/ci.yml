name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  api:
    name: API · build and test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: devflow
          POSTGRES_PASSWORD: devflow-ci
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U devflow" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: apps/api
    env:
      # Integration tests create and drop their own databases on this server.
      ConnectionStrings__DevFlowTest: Host=localhost;Port=5432;Database=postgres;Username=devflow;Password=devflow-ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: apps/api/global.json
      - run: dotnet restore
      - run: dotnet build --no-restore -c Release
      - run: dotnet test --no-build -c Release
      - name: Model and migrations are in sync
        run: |
          dotnet tool restore
          ConnectionStrings__DevFlow="Host=localhost;Database=devflow" \
            dotnet ef migrations has-pending-model-changes --project src/DevFlow.Infrastructure --startup-project src/DevFlow.Api

  web:
    name: Web · lint, typecheck, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
        env:
          API_BASE_URL: http://localhost:5270
      - run: npm run typecheck

  e2e:
    name: End-to-end (Playwright)
    needs: [api, web]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: devflow
          POSTGRES_PASSWORD: devflow-ci
          POSTGRES_DB: devflow
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U devflow" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ConnectionStrings__DevFlow: Host=localhost;Port=5432;Database=devflow;Username=devflow;Password=devflow-ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: apps/api/global.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Migrate database
        working-directory: apps/api
        run: |
          # The EF tool inspects the project before building it, so packages must be restored first.
          dotnet restore
          dotnet tool restore
          dotnet ef database update --project src/DevFlow.Infrastructure --startup-project src/DevFlow.Api

      - name: Start API (Development, for the dev mailbox used by tests)
        working-directory: apps/api
        run: |
          nohup dotnet run --project src/DevFlow.Api --launch-profile http > ${{ runner.temp }}/api.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:5270/api/v1/health && break; sleep 2; done
          curl -sf http://localhost:5270/api/v1/health

      - name: Build and start web
        working-directory: apps/web
        env:
          API_BASE_URL: http://localhost:5270
        run: |
          npm ci
          npm run build
          cp -r public .next/standalone/ && cp -r .next/static .next/standalone/.next/
          nohup node .next/standalone/server.js > ${{ runner.temp }}/web.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:3000/login > /dev/null && break; sleep 2; done

      - name: Run Playwright
        working-directory: apps/web
        env:
          E2E_BASE_URL: http://localhost:3000
        run: |
          npx playwright install --with-deps chromium
          npx playwright test

      - name: Upload report and server logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
            ${{ runner.temp }}/api.log
            ${{ runner.temp }}/web.log
          retention-days: 7

  # Builds every image on every run. On main, once all tests pass, the API and migrator images
  # are also published (privately) to GitHub Container Registry for Azure Container Apps to pull.
  docker:
    name: Docker images
    needs: [api, web, e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      PUBLISH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Image names (registry paths must be lowercase)
        run: echo "IMAGE_PREFIX=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
      - name: Sign in to GitHub Container Registry
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: apps/api
          target: runtime
          push: ${{ env.PUBLISH == 'true' }}
          tags: |
            ${{ env.IMAGE_PREFIX }}/devflow-api:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}/devflow-api:latest
      - name: Build migrator image
        uses: docker/build-push-action@v6
        with:
          context: apps/api
          target: migrator
          push: ${{ env.PUBLISH == 'true' }}
          tags: |
            ${{ env.IMAGE_PREFIX }}/devflow-migrator:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}/devflow-migrator:latest
      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: apps/web
          push: false
          build-args: API_BASE_URL=http://api:8080
          tags: devflow-web:ci
